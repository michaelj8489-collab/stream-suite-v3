<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Broadcast Canvas</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <div id="drag-region"></div>
    
    <div id="scene-countdown" class="scene">
        <div id="countdown-bg-container" style="position: absolute; width: 100%; height: 100%; z-index: 1;"></div>
        
        <div id="countdown-content" style="position: absolute; width: 100%; height: 100%; z-index: 2; display: flex; flex-direction: column; align-items: center;">
            <h1 id="countdown-header-text" style="margin: 0; font-size: 5rem; text-shadow: 4px 4px 15px rgba(0,0,0,0.9);">Starting Soon...</h1>
            <h2 id="countdown-timer" style="margin: 0; font-size: 8rem; font-weight: bold; text-shadow: 4px 4px 15px rgba(0,0,0,0.9);">05:00</h2>
        </div>
    </div>

   <div id="scene-host" class="scene active">
        <video id="host-camera" autoplay muted></video>
        
       <div id="host-frame" style="position: absolute; pointer-events: none; z-index: 5;"></div>
        
        <div id="host-lower-third" style="z-index: 10;">
            <h2 id="host-name-display">Loading...</h2>
            <p id="show-name-display">Loading...</p>
        </div>
    </div>

   <div id="scene-media" class="scene">
        <div id="media-bg-container" style="position: absolute; width: 100%; height: 100%; z-index: 1; filter: blur(25px) brightness(0.3); transform: scale(1.1);"></div>
        
        <div id="media-content" style="position: absolute; width: 100%; height: 100%; z-index: 2; display: flex; align-items: flex-end; justify-content: flex-start; padding: 50px 70px; box-sizing: border-box;">
            <div id="media-overlay-wrapper" style="display: flex; gap: 50px; align-items: center; opacity: 0; transform: translateY(50px); transition: all 1s ease-out;">
                <div id="media-art-container" style="width: 300px; height: 300px; background: #111; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; border: 2px solid rgba(255,255,255,0.1);">
                    <div style="font-size: 7rem;">🎵</div>
                </div>
                <div style="display: flex; flex-direction: column; max-width: 800px;">
                    <h1 id="media-song-title" style="margin: 0; font-size: 4rem; line-height: 1.1; text-shadow: 2px 2px 15px rgba(0,0,0,0.9);">Waiting for Audio...</h1>
                    <h2 id="media-artist-name" style="margin: 10px 0 30px 0; font-size: 2rem; color: #cccccc; font-weight: normal; letter-spacing: 2px;">Stream Suite V3</h2>
                    <div id="media-visualizer" style="display: flex; gap: 8px; height: 60px; align-items: flex-end;"></div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="scene-screenshare" class="scene">
        <video id="screenshare-video" autoplay muted style="width: 100%; height: 100%; object-fit: contain; background: #000;"></video>
    </div>

    <div id="global-banner-container">
        <div id="banner-logo-wrapper" style="display: none; height: 100%; padding: 5px 20px; background: rgba(255,255,255,0.1); border-right: 2px solid #ff5500; z-index: 10001; align-items: center; justify-content: center;">
            <img id="banner-logo-img" src="" style="height: 100%; max-height: 50px; object-fit: contain;">
        </div>
        <div class="ticker-wrap">
            <div id="global-banner-text" class="ticker-text">Welcome to the Live Broadcast!</div>
        </div>
    </div>

    <script src="canvas.js"></script>
</body>
</html>
