<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Chat Hub</title>
    <style>
        body {
            margin: 0; padding-top: 35px;
            background-color: #111; color: #eee;
            border: 2px solid #00aaff; /* Blue border to distinguish from the remote */
            height: 100vh; box-sizing: border-box;
            display: flex; flex-direction: column;
            font-family: sans-serif;
            overflow: hidden;
        }
        #drag-region {
            width: 100%; height: 35px; background-color: #000;
            position: fixed; top: 0; left: 0; z-index: 1000;
            -webkit-app-region: drag; display: flex; align-items: center; justify-content: center;
            border-bottom: 1px solid #00aaff;
        }
        .drag-title { color: #00aaff; font-size: 0.9rem; font-weight: bold; letter-spacing: 2px; }
        
        .chat-box {
            flex: 1; display: flex; flex-direction: column;
            border-bottom: 2px solid #333;
        }
        .chat-header {
            background: #222; padding: 5px; font-size: 0.8rem; 
            text-align: center; border-bottom: 1px solid #333; font-weight: bold;
        }
        iframe { width: 100%; height: 100%; border: none; background: #000; flex-grow: 1; }
    </style>
</head>
<body>
    <div id="drag-region">
        <span class="drag-title">STREAM SUITE CHAT HUB</span>
    </div>
    
    <div class="chat-box">
        <div class="chat-header">RESTREAM.IO GLOBAL CHAT</div>
        <iframe id="iframe-restream" src="about:blank"></iframe>
    </div>
    <div class="chat-box" style="border-bottom: none;">
        <div class="chat-header">EMBERS OF LIGHT CHAT</div>
        <iframe id="iframe-embers" src="about:blank"></iframe>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        
        // Ask the backend for the saved chat URLs and inject them automatically
        async function loadChats() {
            const config = await ipcRenderer.invoke('get-master-config');
            if (config.restreamChatUrl) document.getElementById('iframe-restream').src = config.restreamChatUrl;
            if (config.embersChatUrl) document.getElementById('iframe-embers').src = config.embersChatUrl;
        }
        loadChats();
    </script>
</body>
</html>
