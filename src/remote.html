<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pop-Out Remote</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0; padding-top: 75px; padding-bottom: 60px;
            background-color: #111; color: #eee;
            border: 2px solid #ff5500;
            overflow: hidden;
        }
        
        #drag-region {
            width: 100%; height: 35px; background-color: #000;
            position: fixed; top: 0; left: 0; z-index: 1000;
            -webkit-app-region: drag; display: flex; align-items: center; justify-content: center;
            border-bottom: 1px solid #ff5500;
        }
        .drag-title { color: #ff5500; font-size: 0.9rem; font-weight: bold; letter-spacing: 2px; }
        
        /* NEW: Blueprint Intelligent Window Controls */
        .window-controls-zone {
            position: absolute; right: 0; top: 0; height: 35px; width: 100px;
            -webkit-app-region: no-drag; /* CRITICAL: Clicks fail if this is draggable */
            display: flex; 
            opacity: 0; transition: opacity 1.5s ease; /* Generous 1.5s delay */
        }
        /* Hover intent */
        .window-controls-zone:hover { opacity: 1; transition: opacity 0.2s ease; }
        
        .win-btn { flex: 1; background: transparent; border: none; color: #888; cursor: pointer; font-size: 1rem; }
        .win-btn:hover { background: #333; color: #fff; }
        .win-btn.close:hover { background: #cc0000; }

        /* Remote Tab Navigation */
        .remote-nav {
            display: flex; position: fixed; top: 35px; left: 0; width: 100%; height: 40px;
            background: #000; border-bottom: 1px solid #333; z-index: 999;
        }
        .remote-tab-btn {
            flex: 1; padding: 10px; background: #111; color: #888;
            border: none; border-bottom: 2px solid transparent;
            cursor: pointer; font-weight: bold; text-transform: uppercase;
        }
        .remote-tab-btn.active { background: #1a1a1a; color: #ff5500; border-bottom: 2px solid #ff5500; }

        /* View Containers */
        .remote-view {
            display: none; height: calc(100vh - 135px);
            overflow-y: auto; padding: 15px; box-sizing: border-box;
        }
        .remote-view.active { display: block; }

        /* Hardware-Style Grouping Boxes */
        .control-group { background: rgba(255,255,255,0.03); border: 1px solid #333; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .control-group h3 { margin: 0 0 10px 0; font-size: 0.9rem; color: #888; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .remote-btn { width: 100%; margin-bottom: 8px; padding: 10px; font-size: 1rem; cursor: pointer; }
        .flex-row { display: flex; gap: 10px; margin-bottom: 10px; }

        /* Audio Meter Styling */
        .meter-bg { width: 100%; height: 10px; background: #222; border-radius: 5px; overflow: hidden; margin-bottom: 10px; }
        .meter-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #00ff00, #ffff00, #ff0000); transition: width 0.1s ease; }
        input[type=range] { width: 100%; accent-color: #ff5500; }

        /* Master Go Live Button */
        #go-live-btn { 
            position: fixed; bottom: 0; left: 0; width: 100%; height: 60px;
            background-color: #cc0000; color: white; font-size: 1.5rem; font-weight: bold; 
            border: none; border-top: 2px solid #ff5555; cursor: pointer; text-transform: uppercase; 
            animation: pulseRed 2s infinite; z-index: 1000;
        }
        #go-live-btn.live { background-color: #00cc00; border-top: 2px solid #55ff55; animation: none; }
        @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(204, 0, 0, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(204, 0, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(204, 0, 0, 0); } }
    </style>
</head>
<body>
    <div id="drag-region">
        <span class="drag-title">STREAM SUITE REMOTE</span>
        <div class="window-controls-zone">
            <button class="win-btn" id="win-min">_</button>
            <button class="win-btn" id="win-max">□</button>
            <button class="win-btn close" id="win-close">X</button>
        </div>
    </div>

    <div class="remote-nav">
        <button id="nav-controls" class="remote-tab-btn active">Controls</button>
    </div>
    
    <div id="view-controls" class="remote-view active">
        <button id="open-config-btn" class="secondary-btn remote-btn" style="background: #222;">⚙️ Open Configuration</button>
        
        <div class="control-group">
            <h3>Scene Control</h3>
            <button id="btn-scene-countdown" class="secondary-btn remote-btn">1️⃣ Countdown</button>
            <button id="btn-scene-host" class="primary-btn remote-btn">2️⃣ Live Host</button>
            <button id="btn-scene-media" class="secondary-btn remote-btn">3️⃣ Media Player</button>
            <button id="btn-scene-screenshare" class="secondary-btn remote-btn">4️⃣ Screen Share</button>
        </div>

        <div class="control-group">
            <h3>Live Camera Switcher</h3>
            <div class="flex-row">
                <select id="remote-camera-select" style="flex-grow: 1; padding: 5px; background: #222; color: white; border: 1px solid #444;">
                    <option value="">Scanning cameras...</option>
                </select>
                <button id="remote-camera-switch" class="secondary-btn" style="padding: 5px 15px;">Switch</button>
            </div>
        </div>

        <div class="control-group">
            <h3>Audio Hub</h3>
            <div class="flex-row">
                <button id="remote-mic-toggle" class="primary-btn remote-btn" style="background-color: #00aa00;">🎙️ Mic: ON</button>
                <button id="remote-mic-monitor" class="secondary-btn remote-btn">🎧 Monitor: OFF</button>
            </div>
            <label style="font-size: 0.8rem; color: #aaa;">Mic Volume (Gain)</label>
            <input type="range" id="remote-mic-vol" min="0" max="150" value="100" style="margin-bottom: 15px;">
            <div class="meter-bg"><div id="mic-level-fill" class="meter-fill"></div></div>
            <label style="font-size: 0.8rem; color: #aaa;">Music Volume</label>
            <input type="range" id="remote-music-vol" min="0" max="100" value="10">
            <div class="flex-row" style="margin-top: 10px;">
                <button id="media-btn-prev" class="secondary-btn remote-btn">⏮️</button>
                <button id="media-btn-play" class="primary-btn remote-btn">⏯️</button>
                <button id="media-btn-next" class="secondary-btn remote-btn">⏭️</button>
            </div>
        </div>

        <div class="control-group">
            <h3>Live Text & Metadata</h3>
            <input type="text" id="remote-song-input" class="text-input" placeholder="Song Title / Show Topic" style="margin-bottom: 5px;">
            <input type="text" id="remote-artist-input" class="text-input" placeholder="Artist Name / Guest Name" style="margin-bottom: 10px;">
            <button id="remote-push-metadata" class="secondary-btn remote-btn">Push Text to Canvas</button>
        </div>

        <div class="control-group">
            <h3>Sliding Banner</h3>
            <input type="text" id="remote-banner-input" class="text-input" placeholder="Enter scrolling ticker text..." style="margin-bottom: 5px;">
            <div class="flex-row">
                <button id="remote-banner-img-btn" class="secondary-btn" style="flex-grow: 1;">📷 Change Logo</button>
                <input type="text" id="remote-banner-img-path" class="text-input" placeholder="No logo..." readonly style="width: 50%;">
            </div>
            <button id="remote-banner-toggle" class="secondary-btn remote-btn" style="margin-top: 10px;">Show / Hide Banner</button>
        </div>
        
        <div style="height: 20px;"></div>
    </div>

    <button id="go-live-btn">🔴 GO LIVE</button>

    <script src="remote.js"></script>
</body>
</html>
